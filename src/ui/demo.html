<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vesper Drift — UI demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #070914; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui-root { position: absolute; inset: 0; pointer-events: none; }
  /* Demo-only control strip (not part of the UI layer) */
  #demo-bar {
    position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); z-index: 10;
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 96vw;
    font: 12px system-ui, sans-serif;
  }
  #demo-bar button {
    background: #161b38; color: #eaf0ff; border: 1px solid #2f3a73; border-radius: 6px;
    padding: 4px 10px; cursor: pointer; font: inherit;
  }
  #demo-bar button:hover { border-color: #7fd6ff; }
  #canvas-click { position: absolute; left: 0; top: 0; padding: 4px 8px; font: 11px system-ui; color: #8f9bc7; z-index: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="ui-root"></div>
</div>
<div id="demo-bar" role="toolbar" aria-label="Demo controls">
  <button data-a="title">Title</button>
  <button data-a="play">Play</button>
  <button data-a="up">Stage +1</button>
  <button data-a="down">Stage −1</button>
  <button data-a="choice2">Choice (2)</button>
  <button data-a="choice4">Choice (4)</button>
  <button data-a="warn">Toggle boundary warning</button>
  <button data-a="pause">Pause</button>
  <button data-a="end">Ending</button>
  <button data-a="log">Pointer test</button>
</div>
<div id="canvas-click"></div>

<script type="module">
import { createUI } from './index.js';

// Fake "canvas" so pass-through of pointer events is visible.
const cv = document.getElementById('bg');
const g = cv.getContext('2d');
const stars = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + 0.3, p: Math.random() * 6 }));
function drawBg(t) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  if (cv.width !== innerWidth * dpr) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const grad = g.createRadialGradient(innerWidth / 2, innerHeight / 2, 0, innerWidth / 2, innerHeight / 2, Math.max(innerWidth, innerHeight) * 0.7);
  grad.addColorStop(0, '#10142b'); grad.addColorStop(1, '#070914');
  g.fillStyle = grad; g.fillRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) {
    g.globalAlpha = 0.4 + 0.4 * Math.sin(t / 1000 + s.p);
    g.fillStyle = '#eaf0ff';
    g.beginPath(); g.arc(s.x * innerWidth, s.y * innerHeight, s.r, 0, 6.283); g.fill();
  }
  g.globalAlpha = 1;
  // player
  g.fillStyle = '#ffc15a'; g.shadowColor = '#ff8a3d'; g.shadowBlur = 24;
  g.beginPath(); g.arc(innerWidth / 2, innerHeight / 2, 24, 0, 6.283); g.fill(); g.shadowBlur = 0;
}

const ui = createUI(document.getElementById('ui-root'));

// Fake engine state
const state = { player: {}, bodies: [], time: 0, mass: 1, stageIndex: 0, choices: [], flags: {}, bounds: { radius: 5000 }, status: 'title' };
const need = (i) => 10 * Math.pow(2.2, i);
let paused = false, warn = false, last = performance.now();

ui.onPause((p) => { paused = p; console.log('onPause', p); });

function frame(t) {
  const dt = (t - last) / 1000; last = t;
  if (state.status === 'playing' && !paused) {
    state.time += dt;
    state.mass += dt * need(state.stageIndex) * 0.06;
    if (state.mass >= need(state.stageIndex) && state.stageIndex < 11) { state.stageIndex++; }
  }
  ui.update(state);
  drawBg(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const CHOICES = [
  { id: 'terrestrial', label: 'Terrestrial', description: 'A temperate world. Seas, shorelines and a thin blue haze.' },
  { id: 'lava', label: 'Cinder World', description: 'Rivers of molten rock. Hot rims, slow to cool.' },
  { id: 'metallic', label: 'Iron Heart', description: 'A dense metal core. Heavy, hard to nudge.' },
  { id: 'abandon', label: 'Abandon evolution', description: 'Turn away from the next form. A strange path.' },
];

function startRun() {
  Object.assign(state, { time: 0, mass: 1, stageIndex: 0, status: 'playing' });
  paused = false;
}
function showTitle() { state.status = 'title'; ui.showTitle(startRun); }

const actions = {
  title: showTitle,
  play: () => { ui.setPaused(false); startRun(); },
  up: () => { state.stageIndex = Math.min(11, state.stageIndex + 1); state.mass = need(state.stageIndex - 1); },
  down: () => { state.stageIndex = Math.max(0, state.stageIndex - 1); state.mass = need(Math.max(0, state.stageIndex - 1)); },
  choice2: () => choose(CHOICES.slice(0, 2)),
  choice4: () => choose(CHOICES),
  warn: () => { warn = !warn; ui.warnBoundary(warn); },
  pause: () => { if (state.status === 'playing') { ui.setPaused(true); paused = true; } },
  end: () => {
    state.status = 'ended';
    ui.showEnd({ id: 'creator', title: 'Creator God', text: 'You swallowed the last light and the sky bent around you. Somewhere, small worlds begin to worship the dark.' }, startRun);
  },
  log: () => { document.getElementById('canvas-click').textContent = 'Click the empty sky: the canvas should receive it (HUD is click-through).'; },
};
function choose(list) {
  if (state.status !== 'playing') startRun();
  state.status = 'choice';
  ui.showChoice(list, (id) => { console.log('picked', id); state.status = 'playing'; });
}
document.getElementById('demo-bar').addEventListener('click', (e) => {
  const a = e.target.dataset && e.target.dataset.a;
  if (a && actions[a]) actions[a]();
});
document.getElementById('bg').addEventListener('pointerdown', (e) => {
  document.getElementById('canvas-click').textContent = `canvas got pointerdown at ${e.clientX|0},${e.clientY|0}`;
});

showTitle();
</script>
</body>
</html>
